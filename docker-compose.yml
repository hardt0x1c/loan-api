services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: loan-api-php
    working_dir: /var/www/html
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: loans
      DB_USER: user
      DB_PASSWORD: password
    volumes:
      - ./src:/var/www/html
    networks:
      - loan-api

  nginx:
    image: nginx:1.27-alpine
    container_name: loan-api-nginx
    depends_on:
      - php
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - loan-api

  postgres:
    image: postgres:16-alpine
    container_name: loan-api-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: loans
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - loan-api

volumes:
  postgres_data:

networks:
  loan-api:
    driver: bridge
